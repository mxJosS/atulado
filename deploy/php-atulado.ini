; Ajustes de PHP-FPM para A Tu Lado.
;
;   sudo cp deploy/php-atulado.ini /etc/php/8.5/fpm/conf.d/99-atulado.ini
;   sudo systemctl reload php8.5-fpm
;
; Comprobar:  php-fpm8.5 -i | grep -E "upload_max|post_max|memory_limit|max_execution"

; Padrones en Excel (el default de 2 MB se queda corto con miles de filas)
upload_max_filesize = 25M
post_max_size = 26M

; Leer un Excel grande con PhpSpreadsheet
memory_limit = 512M
max_execution_time = 300

; Producción: nunca mostrar errores en pantalla (sí registrarlos)
display_errors = Off
log_errors = On
