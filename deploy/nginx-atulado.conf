# Fragmento para el bloque `server { ... }` de atulado.com.mx en Nginx.
# No reemplaza tu configuración: agrega o ajusta estas líneas.
#
#   sudo nano /etc/nginx/sites-available/atulado   (o el archivo que uses)
#   sudo nginx -t && sudo systemctl reload nginx

# Por defecto Nginx rechaza cuerpos de más de 1 MB: un padrón en Excel
# grande respondería "413 Request Entity Too Large".
client_max_body_size 25M;

# No anunciar la versión de Nginx.
server_tokens off;

# ── SEGURIDAD: sólo se ejecuta public/index.php ──────────────────────────
# Si tu bloque tiene `location ~ \.php$ { ... fastcgi_pass ... }`, Nginx
# ejecutaría CUALQUIER archivo .php, incluido uno subido a public/storage.
# Cámbialo por estas dos reglas: index.php se ejecuta y todo lo demás que
# termine en .php responde 404.
location = /index.php {
    # ... tu configuración actual de fastcgi_pass / include snippets ...
    # (p. ej. include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.5-fpm.sock;)

    # Un padrón de miles de filas puede tardar más de 60 s en procesarse.
    fastcgi_read_timeout 300;
}

location ~ \.php$ {
    return 404;
}

# Lo que suben las personas (portadas, avatares) nunca se interpreta como código.
location ^~ /storage/ {
    try_files $uri =404;
    add_header X-Content-Type-Options "nosniff" always;
}

# Archivos ocultos (.env, .git, …) nunca se sirven.
location ~ /\.(?!well-known) {
    deny all;
}

# Para revisar que no se haya subido ningún .php antes de este cambio:
#   find /var/www/atulado/storage/app/public -name "*.php*" -ls
