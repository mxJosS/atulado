# Límite de peticiones por IP para A Tu Lado (contexto http de Nginx).
#
#   sudo cp deploy/nginx-limites.conf /etc/nginx/conf.d/atulado-limites.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sólo cuenta las peticiones que llegan a PHP (páginas y formularios), no las
# imágenes, CSS ni JS: una página con 30 recursos no gasta el límite. Con 10
# por segundo y ráfagas de 50, un colegio entero detrás de una misma IP navega
# sin notarlo; un script que dispara cientos por segundo recibe 429.
# Los formularios sensibles (login, registro, contacto…) ya tienen además sus
# propios límites dentro de la app (AppServiceProvider::limitesDeIntentos).
#
# Para activarlo, en deploy/nginx-atulado.conf ya está la línea
# `limit_req zone=atulado_php ...` dentro de `location = /index.php`.

limit_req_zone $binary_remote_addr zone=atulado_php:10m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;

# ── Si se pone Cloudflare delante ────────────────────────────────────────
# Nginx vería la IP de Cloudflare en vez de la del visitante: el límite y
# fail2ban castigarían a Cloudflare entero. Descomenta y pon los rangos
# vigentes de https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6
# (uno por línea). Pon esos mismos rangos en TRUSTED_PROXIES del .env.
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# ... (resto de rangos)
# real_ip_header CF-Connecting-IP;
