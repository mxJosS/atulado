# Respuestas de rechazo: 404 (ruta que no existe), 403 y 444. Una persona casi
# nunca junta muchas seguidas; un escáner, cientos por minuto.
# El 429 (demasiadas peticiones) NO cuenta a propósito: un salón entero sale a
# internet con la misma IP y bloquearla dejaría fuera a toda la escuela.
[Definition]
failregex = ^<HOST> -[^"]*"[A-Z]+ [^"]*" (?:403|404|444) 
ignoreregex = ^<HOST> -[^"]*"GET /(?:favicon\.ico|robots\.txt|apple-touch-icon[^ ]*) 
