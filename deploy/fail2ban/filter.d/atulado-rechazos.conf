# Respuestas de rechazo: 404 (ruta que no existe), 403, 444 y 429 (pasó el
# límite de peticiones de Nginx o de la app). Una persona casi nunca junta
# muchas seguidas; un escáner, cientos por minuto.
[Definition]
failregex = ^<HOST> -[^"]*"[A-Z]+ [^"]*" (?:403|404|444|429)
ignoreregex = ^<HOST> -[^"]*"GET /(?:favicon\.ico|robots\.txt|apple-touch-icon[^ ]*)
