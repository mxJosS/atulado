# Páginas de estado internas para el monitor del servidor de A Tu Lado.
# Sólo escuchan en 127.0.0.1:8089: no se pueden abrir desde internet.
#
# Instalación (una vez):
#
#   1) Nginx:
#        sudo cp deploy/nginx-monitor.conf /etc/nginx/conf.d/atulado-monitor.conf
#        (ajusta la ruta del socket de PHP-FPM si no es php8.5-fpm.sock)
#
#   2) PHP-FPM: en /etc/php/8.5/fpm/pool.d/www.conf descomenta o agrega:
#        pm.status_path = /fpm-status
#
#   3) Aplica:
#        sudo nginx -t && sudo systemctl reload nginx
#        sudo systemctl reload php8.5-fpm
#
#   4) Comprueba desde el servidor:
#        curl http://127.0.0.1:8089/nginx_status
#        curl "http://127.0.0.1:8089/fpm-status?json"
#
#   5) En el .env de la app (y luego php artisan config:cache && php artisan route:cache):
#        ATULADO_MONITOR_RUTA=<la ruta secreta del monitor>
#
# Temperatura: en un servidor físico instala lm-sensors (sudo apt install lm-sensors
# && sudo sensors-detect) para que aparezcan los sensores en /sys/class/hwmon.
# En un VPS no hay sensores: el monitor lo indica.

server {
    listen 127.0.0.1:8089;
    server_name localhost;
    access_log off;

    allow 127.0.0.1;
    deny all;

    location = /nginx_status {
        stub_status;
    }

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-status;
        fastcgi_param SCRIPT_FILENAME /fpm-status;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location / {
        return 404;
    }
}
