[variables]
NIXPACKS_PHP_VERSION = "8.4"
COMPOSER_ALLOW_SUPERUSER = "1"

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan storage:link --force && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host 0.0.0.0 --port $PORT"

